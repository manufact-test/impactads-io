<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 828 756" fill="none" aria-hidden="true">
  <defs>
    <linearGradient id="iac-contact-red" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF0027" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FF0027" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FF0027" stop-opacity="0"/>
    </linearGradient>
    <filter id="iac-contact-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- handoff route -->
  <path d="M210 378 H430" stroke="url(#iac-contact-red)" stroke-width="1.5" stroke-dasharray="4 7" opacity="0.75"/>
  <path d="M430 378 H618" stroke="#FF0027" stroke-width="1.8" opacity="0.55"/>
  <circle cx="210" cy="378" r="5" fill="#FF0027" filter="url(#iac-contact-glow)"/>
  <circle cx="430" cy="378" r="4" fill="#FF0027" opacity="0.85"/>
  <circle cx="618" cy="378" r="6" fill="#FF0027" filter="url(#iac-contact-glow)"/>

  <!-- dedicated contact panel -->
  <rect x="96" y="248" width="228" height="260" rx="14" stroke="rgba(255,255,255,0.22)" stroke-width="1.2"/>
  <rect x="96" y="248" width="228" height="260" rx="14" stroke="#FF0027" stroke-width="1" opacity="0.35"/>
  <circle cx="210" cy="332" r="34" stroke="rgba(255,255,255,0.72)" stroke-width="1.8"/>
  <circle cx="210" cy="318" r="14" stroke="rgba(255,255,255,0.72)" stroke-width="1.8"/>
  <path d="M176 392c0-18 15-32 34-32s34 14 34 32" stroke="rgba(255,255,255,0.72)" stroke-width="1.8" stroke-linecap="round"/>
  <text x="210" y="468" text-anchor="middle" fill="rgba(255,255,255,0.55)" font-family="Inter,Segoe UI,sans-serif" font-size="13" letter-spacing="0.18em">CONTACT</text>

  <!-- terms checkpoint -->
  <rect x="356" y="318" width="148" height="120" rx="12" stroke="rgba(255,255,255,0.16)" stroke-width="1.1"/>
  <path d="M430 344l18 8v16c0 14-8 24-18 28-10-4-18-14-18-28v-16z" stroke="rgba(255,255,255,0.62)" stroke-width="1.6"/>
  <path d="M422 372l6 6 12-14" stroke="#FF0027" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="430" y="418" text-anchor="middle" fill="rgba(255,255,255,0.42)" font-family="Inter,Segoe UI,sans-serif" font-size="11" letter-spacing="0.14em">TERMS</text>

  <!-- handoff node -->
  <rect x="552" y="292" width="180" height="172" rx="14" stroke="rgba(255,255,255,0.2)" stroke-width="1.2"/>
  <rect x="552" y="292" width="180" height="172" rx="14" stroke="#FF0027" stroke-width="1.2" opacity="0.45"/>
  <rect x="584" y="348" width="116" height="52" rx="8" stroke="rgba(255,255,255,0.35)" stroke-width="1.4"/>
  <path d="M612 374h52" stroke="#FF0027" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M648 358l16 16-16 16" stroke="#FF0027" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="642" y="332" text-anchor="middle" fill="rgba(255,255,255,0.55)" font-family="Inter,Segoe UI,sans-serif" font-size="13" letter-spacing="0.18em">HANDOFF</text>

  <!-- status chips -->
  <rect x="124" y="536" width="172" height="34" rx="17" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
  <circle cx="144" cy="553" r="3" fill="#FF0027"/>
  <text x="158" y="557" fill="rgba(255,255,255,0.48)" font-family="Inter,Segoe UI,sans-serif" font-size="11">one desk · one thread</text>

  <rect x="566" y="536" width="152" height="34" rx="17" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
  <circle cx="586" cy="553" r="3" fill="#FF0027"/>
  <text x="600" y="557" fill="rgba(255,255,255,0.48)" font-family="Inter,Segoe UI,sans-serif" font-size="11">direct channel</text>
</svg>
