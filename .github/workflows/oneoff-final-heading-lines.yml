name: Final CTA heading lines

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/oneoff-final-heading-lines.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply heading line breaks
        run: python3 .github/oneoff_final_heading_lines.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Split final CTA heading into three lines"
          git push origin HEAD:main
