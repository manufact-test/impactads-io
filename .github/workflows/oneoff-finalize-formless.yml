name: Finalize formless homepage routing

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/oneoff-finalize-formless.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply and validate
        run: python3 .github/oneoff_finalize_formless.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Finalize homepage CTA routing"
          git push origin HEAD:main
