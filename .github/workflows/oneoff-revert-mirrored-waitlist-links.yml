name: Revert mirrored static waitlist link edits

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/oneoff-revert-mirrored-waitlist-links.yml

permissions:
  contents: write

jobs:
  revert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore untouched mirrored Next static HTML
        run: |
          set -euo pipefail
          git checkout c1633f4b4be5830c4d69f3536871be11bdda3486 -- wp-content/plugins/impact-accs-homepage/assets/site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/oneoff-revert-mirrored-waitlist-links.yml
          git add wp-content/plugins/impact-accs-homepage/assets/site
          git commit -m "Keep mirrored Next assets untouched"
          git push origin HEAD:main
