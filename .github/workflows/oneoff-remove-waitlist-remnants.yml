name: Homepage cleanup patch

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply patch
        run: python3 .github/scripts/oneoff-remove-waitlist-remnants.py

      - name: Verify patch
        run: |
          grep -q "var waitlistError = section.querySelector('#waitlist-error')" wp-content/plugins/impact-accs-homepage/assets/js/wp-bridge.js
          grep -q 'border-radius:6px;background:var(--iah-faq-red)' wp-content/plugins/impact-accs-homepage/assets/js/wp-bridge.js
          grep -q 'Version:           1.5.52' wp-content/plugins/impact-accs-homepage/impact-accs-homepage.php

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/oneoff-remove-waitlist-remnants.yml .github/scripts/oneoff-remove-waitlist-remnants.py
          git add wp-content/plugins/impact-accs-homepage/assets/js/wp-bridge.js wp-content/plugins/impact-accs-homepage/impact-accs-homepage.php
          git commit -m "Remove waitlist remnants and restyle FAQ CTA"
          git push origin HEAD:main
