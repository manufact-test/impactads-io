name: One-off formless homepage patch

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/oneoff-formless-homepage.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply source patch
        run: |
          sed -i 's/private static function waitlist_click_guard_script/function waitlist_click_guard_script/' .github/oneoff_formless_patch.py
          python3 .github/oneoff_formless_patch.py

      - name: Validate and commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git diff --cached --check
          git commit -m "Remove homepage forms and route CTAs to Telegram"
          git push origin HEAD:main
