name: One-time React preloader brand migration

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/one-time-react-preloader-brand.yml

permissions:
  contents: write

jobs:
  patch-react-preloader:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch React loader source and matching server export
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout main
          git reset --hard origin/main

          python <<'PY'
          from pathlib import Path

          chunk_path = Path('wp-content/plugins/impact-accs-homepage/assets/site/_next/static/chunks/1e7f2c52e84d02fd.js')
          html_path = Path('wp-content/plugins/impact-accs-homepage/content/index.html')
          core_css_path = Path('wp-content/plugins/impact-accs-homepage/assets/site/_next/static/chunks/e404d10d1b589fe4.css')
          tools_css_path = Path('wp-content/plugins/impact-accs-chrome/assets/css/header-tools.css')
          chrome_php_path = Path('wp-content/plugins/impact-accs-chrome/impact-accs-chrome.php')

          chunk = chunk_path.read_text(encoding='utf-8')
          old_react = 'children:"impact.accs"'
          new_react = 'children:"impact."'
          count = chunk.count(old_react)
          if count != 1:
              raise SystemExit(f'Expected exactly 1 React loader brand literal, found {count}')
          chunk = chunk.replace(old_react, new_react, 1)
          chunk_path.write_text(chunk, encoding='utf-8')

          html = html_path.read_text(encoding='utf-8')
          old_html = '<span class="block">impact.accs</span><span class="block">Initializing</span>'
          new_html = '<span class="block">impact.</span><span class="block">Initializing</span>'
          count = html.count(old_html)
          if count != 1:
              raise SystemExit(f'Expected exactly 1 server loader brand pair, found {count}')
          html = html.replace(old_html, new_html, 1)

          # Cache-bust only the two assets changed by this fix. Replace every
          # reference, including the matching Flight/module path, so React sees
          # the same client bundle throughout hydration.
          chunk_ref = '{{IAH_ASSET_BASE}}_next/static/chunks/1e7f2c52e84d02fd.js'
          css_ref = '{{IAH_ASSET_BASE}}_next/static/chunks/e404d10d1b589fe4.css'
          if chunk_ref not in html:
              raise SystemExit('React loader chunk reference not found in export')
          if css_ref not in html:
              raise SystemExit('Homepage core CSS reference not found in export')
          html = html.replace(chunk_ref, chunk_ref + '?v=impact-brand-20260825')
          html = html.replace(css_ref, css_ref + '?v=impact-brand-20260825')
          html_path.write_text(html, encoding='utf-8')

          # Remove the temporary visual CSS overlay from the compiled homepage CSS.
          core_css = core_css_path.read_text(encoding='utf-8')
          overlay = '[data-loader-content] h2.font-display>span.block:first-child{position:relative;color:transparent!important;text-shadow:none!important}[data-loader-content] h2.font-display>span.block:first-child:after{content:"impact.";position:absolute;inset:0;color:var(--primary,#ff0027);text-shadow:0 0 10px rgba(255,0,39,.68)}\n'
          if overlay not in core_css:
              raise SystemExit('Expected compiled CSS brand overlay not found')
          core_css = core_css.replace(overlay, '', 1)
          core_css_path.write_text(core_css, encoding='utf-8')

          # Remove the second temporary visual overlay from the WordPress chrome CSS.
          tools_css = tools_css_path.read_text(encoding='utf-8')
          marker = '/* Homepage preloader branding — visual-only so React hydration stays untouched. */'
          start = tools_css.find(marker)
          if start == -1:
              raise SystemExit('Expected header-tools preloader overlay marker not found')
          next_marker = tools_css.find('/* Homepage chrome footer', start)
          if next_marker == -1:
              raise SystemExit('Could not find end marker for header-tools overlay')
          tools_css = tools_css[:start] + tools_css[next_marker:]
          tools_css_path.write_text(tools_css, encoding='utf-8')

          # Bust header-tools.css cache after removing the visual overlay.
          chrome_php = chrome_php_path.read_text(encoding='utf-8')
          version_count = chrome_php.count('2.4.76')
          if version_count != 2:
              raise SystemExit(f'Expected 2 chrome version literals, found {version_count}')
          chrome_php = chrome_php.replace('2.4.76', '2.4.77')
          chrome_php_path.write_text(chrome_php, encoding='utf-8')

          # Guardrails: loader is now native impact. on both sides, while unrelated
          # legacy SEO metadata is intentionally untouched.
          if 'children:"impact.accs"' in chunk:
              raise SystemExit('Old React loader brand still present')
          if old_html in html:
              raise SystemExit('Old server loader brand still present')
          if 'impact.accs | Closed Access Infrastructure' not in html:
              raise SystemExit('Unexpectedly changed unrelated homepage metadata')
          PY

          php -l wp-content/plugins/impact-accs-chrome/impact-accs-chrome.php

          git diff --check
          git status --short

      - name: Commit native React fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            wp-content/plugins/impact-accs-homepage/assets/site/_next/static/chunks/1e7f2c52e84d02fd.js \
            wp-content/plugins/impact-accs-homepage/content/index.html \
            wp-content/plugins/impact-accs-homepage/assets/site/_next/static/chunks/e404d10d1b589fe4.css \
            wp-content/plugins/impact-accs-chrome/assets/css/header-tools.css \
            wp-content/plugins/impact-accs-chrome/impact-accs-chrome.php
          git commit -m "Fix preloader brand in React bundle"

          for attempt in 1 2 3 4; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git fetch origin main
            git rebase origin/main
            sleep $((attempt * 2))
          done
          echo "Failed to push React preloader fix after retries" >&2
          exit 1
