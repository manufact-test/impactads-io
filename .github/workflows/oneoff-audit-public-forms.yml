name: Audit public forms

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/oneoff-audit-public-forms.yml
      - .github/scripts/audit-public-forms.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Audit public forms
        run: python3 .github/scripts/audit-public-forms.py
      - name: Save audit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public-form-audit.md
          git commit -m "Record public form audit"
          git push origin HEAD:main
