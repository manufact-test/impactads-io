name: Replace public forms with Telegram CTA

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/oneoff-telegram-all-public-forms.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate and apply form replacement
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile .github/scripts/oneoff-telegram-public-forms-v2.py
          python3 .github/scripts/oneoff-telegram-public-forms-v2.py

      - name: Bump cache versions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          hp = Path('wp-content/plugins/impact-accs-homepage/impact-accs-homepage.php')
          s = hp.read_text(encoding='utf-8')
          s = s.replace('Version:           1.5.53', 'Version:           1.5.54', 1)
          s = s.replace("define( 'IAH_VERSION', '1.5.53' );", "define( 'IAH_VERSION', '1.5.54' );", 1)
          hp.write_text(s, encoding='utf-8')

          chrome = Path('wp-content/plugins/impact-accs-chrome/impact-accs-chrome.php')
          s = chrome.read_text(encoding='utf-8')
          s = s.replace('Version:           2.4.72', 'Version:           2.4.74', 1)
          s = s.replace("define( 'IAC_VERSION', '2.4.73' );", "define( 'IAC_VERSION', '2.4.74' );", 1)
          chrome.write_text(s, encoding='utf-8')
          PY

      - name: Verify public result
        shell: bash
        run: |
          set -euo pipefail
          ! grep -RniE '<form\b' wp-content/plugins/impact-accs-chrome/templates
          ! grep -RniE 'waitlist-error|application-error|type="submit"|By signing up' \
            wp-content/plugins/impact-accs-chrome/templates/application-page.html \
            wp-content/plugins/impact-accs-chrome/templates/waitlist-modal.html \
            wp-content/plugins/impact-accs-chrome/templates/footer.html
          grep -q 'https://t.me/founderads' wp-content/plugins/impact-accs-chrome/templates/application-page.html
          grep -q 'https://t.me/founderads' wp-content/plugins/impact-accs-chrome/templates/footer.html
          grep -q 'https://t.me/founderads' wp-content/plugins/impact-accs-chrome/templates/waitlist-modal.html
          grep -q 'Version:           1.5.54' wp-content/plugins/impact-accs-homepage/impact-accs-homepage.php
          grep -q 'Version:           2.4.74' wp-content/plugins/impact-accs-chrome/impact-accs-chrome.php
          php -l wp-content/plugins/impact-accs-chrome/impact-accs-chrome.php
          php -l wp-content/plugins/impact-accs-chrome/includes/class-page-faq.php
          php -l wp-content/plugins/impact-accs-homepage/impact-accs-homepage.php

      - name: Commit product changes and clean temporary audit files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f \
            .github/scripts/audit-public-forms.py \
            .github/scripts/oneoff-telegram-for-all-public-forms.py \
            .github/scripts/oneoff-telegram-public-forms-v2.py \
            .github/workflows/oneoff-audit-public-forms.yml \
            .github/workflows/oneoff-telegram-all-public-forms.yml \
            public-form-audit.md
          git add -A
          git commit -m "Replace public forms with Telegram CTA"
          git push origin HEAD:main
