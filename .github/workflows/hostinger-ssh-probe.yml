name: Hostinger SSH Probe

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/hostinger-ssh-probe.yml

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run safe SSH diagnostics
        shell: bash
        env:
          HOSTINGER_SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
        run: |
          set +e

          RESULT="ssh-probe-result.md"
          KEY_FILE="$HOME/.ssh/impactads_hostinger"
          KNOWN_HOSTS="$HOME/.ssh/known_hosts"
          HOST="45.84.206.26"
          PORT="65002"
          USER="u218517330"

          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"

          KEY_PRESENT="no"
          KEY_VALID="not-tested"
          KEYSCAN_STATUS="not-tested"
          SSH_STATUS="not-tested"

          : > key-error.txt
          : > keyscan-error.txt
          : > remote-output.txt
          : > remote-error.txt

          if [ -n "$HOSTINGER_SSH_KEY" ]; then
            KEY_PRESENT="yes"
            printf '%s\n' "$HOSTINGER_SSH_KEY" > "$KEY_FILE"
            chmod 600 "$KEY_FILE"
            if ssh-keygen -y -f "$KEY_FILE" >/dev/null 2>key-error.txt; then
              KEY_VALID="yes"
            else
              KEY_VALID="no"
            fi
          fi

          if ssh-keyscan -T 15 -p "$PORT" -H "$HOST" > "$KNOWN_HOSTS" 2>keyscan-error.txt; then
            KEYSCAN_STATUS="ok"
            chmod 600 "$KNOWN_HOSTS"
          else
            KEYSCAN_STATUS="failed"
          fi

          if [ "$KEY_VALID" = "yes" ] && [ "$KEYSCAN_STATUS" = "ok" ]; then
            ssh \
              -i "$KEY_FILE" \
              -p "$PORT" \
              -o BatchMode=yes \
              -o ConnectTimeout=15 \
              "$USER@$HOST" 'bash -s' >remote-output.txt 2>remote-error.txt <<'REMOTE'
          set -u
          echo 'SSH_OK'
          printf 'USER='; id -un
          printf 'PWD='; pwd
          printf 'HOME='; printf '%s\n' "$HOME"
          echo '--- candidate web roots ---'
          for d in \
            "$HOME/public_html" \
            "$HOME/domains/impactads.io/public_html"; do
            echo "CANDIDATE=$d"
            printf 'REALPATH='; readlink -f "$d" 2>/dev/null || true
            if [ -d "$d" ]; then
              ls -ld "$d"
              [ -f "$d/wp-config.php" ] && echo 'WP_CONFIG=yes' || echo 'WP_CONFIG=no'
              [ -f "$d/wp-load.php" ] && echo 'WP_LOAD=yes' || echo 'WP_LOAD=no'
              [ -d "$d/wp-content" ] && echo 'WP_CONTENT=yes' || echo 'WP_CONTENT=no'
              [ -d "$d/wp-admin" ] && echo 'WP_ADMIN=yes' || echo 'WP_ADMIN=no'
              [ -f "$d/index.php" ] && echo 'INDEX=yes' || echo 'INDEX=no'
              [ -f "$d/wp-config.php" ] && sha256sum "$d/wp-config.php" 2>/dev/null || true
              echo 'TOP_LEVEL:'
              find "$d" -maxdepth 1 -mindepth 1 -printf '%f\n' 2>/dev/null | sort | sed -n '1,60p'
            else
              echo 'EXISTS=no'
            fi
            echo '---'
          done
          echo '--- tools ---'
          command -v git || true
          git --version 2>/dev/null || true
          command -v rsync || true
          rsync --version 2>/dev/null | head -n 1 || true
          command -v php || true
          php -v 2>/dev/null | head -n 2 || true
          command -v wp || true
          wp --info 2>/dev/null | sed -n '1,20p' || true
          REMOTE
            RC=$?
            if [ "$RC" -eq 0 ]; then
              SSH_STATUS="ok"
            else
              SSH_STATUS="failed ($RC)"
            fi
          fi

          {
            echo '# Hostinger SSH Probe Result'
            echo
            echo "- key present: $KEY_PRESENT"
            echo "- private key parses: $KEY_VALID"
            echo "- Hostinger host key reachable: $KEYSCAN_STATUS"
            echo "- SSH authentication/session: $SSH_STATUS"
            echo
            echo '## Remote output'
            echo '```text'
            sed -n '1,240p' remote-output.txt
            echo '```'
            echo
            echo '## Key validation error'
            echo '```text'
            sed -n '1,40p' key-error.txt
            echo '```'
            echo
            echo '## Host-key scan error'
            echo '```text'
            sed -n '1,40p' keyscan-error.txt
            echo '```'
            echo
            echo '## SSH error'
            echo '```text'
            sed -n '1,80p' remote-error.txt
            echo '```'
          } > "$RESULT"

          rm -f "$KEY_FILE" "$KNOWN_HOSTS" key-error.txt keyscan-error.txt remote-output.txt remote-error.txt

      - name: Save diagnostic result to repository
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ssh-probe-result.md
          if git diff --cached --quiet; then
            echo "No diagnostic changes to commit."
            exit 0
          fi
          git commit -m "Record Hostinger SSH probe diagnostics"
          git push
