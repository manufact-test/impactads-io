name: Hostinger SSH Probe

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/hostinger-ssh-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Prepare SSH key
        shell: bash
        env:
          HOSTINGER_SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$HOSTINGER_SSH_KEY"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$HOSTINGER_SSH_KEY" > ~/.ssh/impactads_hostinger
          chmod 600 ~/.ssh/impactads_hostinger
          ssh-keygen -y -f ~/.ssh/impactads_hostinger >/dev/null

      - name: Trust Hostinger SSH host key
        shell: bash
        run: |
          set -euo pipefail
          ssh-keyscan -p 65002 -H 45.84.206.26 >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Probe Hostinger environment
        shell: bash
        run: |
          set -euo pipefail
          ssh \
            -i ~/.ssh/impactads_hostinger \
            -p 65002 \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            u218517330@45.84.206.26 'bash -s' <<'REMOTE'
          set -eu
          echo 'SSH_OK'
          printf 'USER='; id -un
          printf 'PWD='; pwd
          printf 'HOME='; printf '%s\n' "$HOME"
          echo '--- candidate web roots ---'
          for d in \
            "$HOME/public_html" \
            "$HOME/domains/impactads.io/public_html" \
            "$HOME/domains/impactads.io"; do
            if [ -d "$d" ]; then
              printf 'FOUND_DIR=%s\n' "$d"
              ls -ld "$d"
            fi
          done
          echo '--- tools ---'
          command -v git || true
          git --version 2>/dev/null || true
          command -v rsync || true
          rsync --version 2>/dev/null | head -n 1 || true
          command -v php || true
          php -v 2>/dev/null | head -n 2 || true
          echo '--- home listing ---'
          ls -la "$HOME" | sed -n '1,80p'
          REMOTE
