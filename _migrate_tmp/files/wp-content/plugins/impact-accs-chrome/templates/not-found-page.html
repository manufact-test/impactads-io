<div class="iac-not-found-page notranslate">
	<div class="iac-nf-game-shell">
		<div class="iac-nf-canvas-host">
			<canvas id="iac-nf-canvas" class="iac-nf-canvas" tabindex="0" role="img" aria-label="Space Invaders 404 Game"></canvas>
		</div>

		<div class="iac-nf-hud font-misc iac-nf-hud--hidden" id="iac-nf-hud" aria-hidden="true">
			<span class="iac-nf-score" id="iac-nf-score">SCORE 000000</span>
			<div class="iac-nf-lives" id="iac-nf-lives" aria-label="3 lives remaining">

		<div class="iac-nf-dim" id="iac-nf-dim"></div>

		<div class="iac-nf-idle-center" id="iac-nf-idle-center">
			<div class="iac-nf-idle-card-wrap">
				<div class="iac-nf-pixel-decor" aria-hidden="true">
					<svg class="iac-nf-pixel-decor-svg" viewBox="0 0 120 24" fill="none" xmlns="http://www.w3.org/2000/svg">

				<div class="iac-nf-idle-card">

						<h1 class="iac-nf-idle-title text-title text-glow">Page<br>not<br>found</h1>
					</div>
					<div class="iac-nf-idle-card__cta">

					</div>
					<div class="iac-nf-idle-card__cta iac-nf-idle-card__cta--wide">
						<button type="button" class="iac-nf-btn iac-nf-btn--secondary iac-nf-btn--icon font-misc" id="iac-nf-restart-end" aria-label="Restart">↻</button>
						<a class="iac-nf-btn iac-nf-btn--primary iac-nf-btn--home-flex font-misc" href="/">Back home</a>
					</div>
				</div>
			</div>
		</div>

		<div class="iac-nf-boss-banner" id="iac-nf-boss-banner" hidden>
			<h2 class="iac-nf-idle-title iac-nf-boss-title text-title text-glow">Now face<br>the final boss</h2>
		</div>

		<div class="iac-nf-tap-hint-wrap" id="iac-nf-tap-hint-wrap">
